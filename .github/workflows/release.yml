name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: "App version (e.g. 1.0.0)"
        required: false
        default: "1.0.0"
  release:
    types: [published]

permissions:
  contents: write

env:
  # Must match WHISPER_CPP_TAG in engines/whispercpp.py and in
  # scripts/tools/fetch_whispercpp.sh; it also keys the build cache below.
  WHISPER_CPP_TAG: v1.7.5
  # MASTER.md risk table: fail the release rather than ship a fat image.
  DMG_MAX_MB: "400"

jobs:
  test:
    # macOS 26 on Apple Silicon. The MLX wheels are tagged macosx_26_0_arm64,
    # so an older or Intel runner cannot install the Voxtral engine at all.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  build-dmg:
    runs-on: macos-26
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Fail on a non-arm64 runner
        run: |
          ARCH="$(uname -m)"
          if [ "${ARCH}" != "arm64" ]; then
            echo "Release builds must run on Apple Silicon (got ${ARCH}); MLX has no other wheels."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "${TAG_NAME}" ]; then
            VERSION="${TAG_NAME#v}"
          elif [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          else
            VERSION="1.0.0"
          fi
          echo "app_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building Murmur ${VERSION}"

      - name: Check signing secrets
        id: signing
        env:
          CODE_SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          missing=()
          for var in CODE_SIGN_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD; do
            if [ -z "${!var:-}" ]; then
              missing+=("${var}")
            fi
          done
          if [ ${#missing[@]} -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Signed release: Developer ID + notarization (the default path)"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Internal ad-hoc build (missing secrets: ${missing[*]})"
            echo "The bundle will carry build_info.json with channel=internal."
          fi

      # An ad-hoc build must never become a release asset: Gatekeeper blocks it
      # on other Macs and the in-app updater refuses to install one, so it would
      # be published as an update nobody can take. Internal builds stay workflow
      # artifacts. Fail here, before the twenty-minute build.
      - name: Refuse an unsigned release
        if: github.event_name == 'release' && steps.signing.outputs.configured != 'true'
        run: |
          echo "::error::Publishing a release requires the signing secrets (see RELEASE_SIGNING.md)."
          echo "An unsigned ad-hoc DMG cannot be attached to a GitHub Release."
          exit 1

      # Decision D2: the app ships whisper.cpp as a child process. Building it
      # takes minutes, and it only changes when the pinned tag does.
      - name: Restore whisper-server
        id: whispercpp-cache
        uses: actions/cache@v4
        with:
          path: vendor/whispercpp
          key: whispercpp-${{ runner.os }}-${{ runner.arch }}-${{ env.WHISPER_CPP_TAG }}

      - name: Build whisper-server
        if: steps.whispercpp-cache.outputs.cache-hit != 'true'
        env:
          WHISPER_CPP_TAG: ${{ env.WHISPER_CPP_TAG }}
        run: bash scripts/tools/fetch_whispercpp.sh

      - name: Verify whisper-server is present
        run: |
          test -x vendor/whispercpp/whisper-server
          file vendor/whispercpp/whisper-server

      - name: Create virtualenv and install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Import signing certificate
        if: steps.signing.outputs.configured == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "KEYCHAIN_PATH=${KEYCHAIN_PATH}" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          umask 077
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          # -T names the only two tools allowed to use the key; -A would hand it
          # to every binary on the runner, including anything a dependency runs.
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      # release.sh builds, signs inside-out, notarizes and staples the app, then
      # the DMG, and finally refreshes scripts/homebrew/murmur.rb.
      - name: Build signed release
        if: steps.signing.outputs.configured == 'true'
        env:
          CODE_SIGN_IDENTITY: ${{ secrets.CODE_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARIZE: "true"
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          DMG_MAX_MB: ${{ env.DMG_MAX_MB }}
        run: |
          chmod +x scripts/release.sh scripts/build_pyinstaller.sh scripts/create_dmg.sh
          ./scripts/release.sh

      - name: Build ad-hoc release (internal)
        if: steps.signing.outputs.configured != 'true'
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
          BUILD_CHANNEL: internal
          DMG_MAX_MB: ${{ env.DMG_MAX_MB }}
        run: |
          chmod +x scripts/build_pyinstaller.sh scripts/create_dmg.sh
          ./scripts/create_dmg.sh --build

      - name: Check the bundle contents and the DMG size
        env:
          APP_VERSION: ${{ steps.version.outputs.app_version }}
        run: |
          test -f "dist/Murmur.app/Contents/Resources/build_info.json"
          cat "dist/Murmur.app/Contents/Resources/build_info.json"
          find dist/Murmur.app/Contents -type f -name whisper-server -path '*/bin/*' | grep -q .
          if find dist/Murmur.app/Contents \( -name torch -o -name 'libtorch*' \) -print -quit | grep -q .; then
            echo "torch is back in the bundle"
            exit 1
          fi
          DMG="dist/Murmur-${APP_VERSION}.dmg"
          SIZE_MB=$(( $(stat -f%z "${DMG}") / 1000000 ))
          echo "${DMG}: ${SIZE_MB} MB (budget ${DMG_MAX_MB} MB)"
          if [ "${SIZE_MB}" -gt "${DMG_MAX_MB}" ]; then
            echo "DMG over budget — see the risk table in docs/work/active/2026-09-02-murmur-v2/MASTER.md"
            exit 1
          fi

      - name: Upload DMG workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: murmur-macos-dmg-${{ steps.version.outputs.app_version }}
          path: |
            dist/Murmur-*.dmg
            dist/Murmur-*.dmg.sha256
          if-no-files-found: error

      # Signed builds only. The step above already published the internal build
      # as a workflow artifact, which is where an ad-hoc DMG belongs.
      - name: Attach DMG to GitHub Release
        if: github.event_name == 'release' && steps.signing.outputs.configured == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Murmur-*.dmg
            dist/Murmur-*.dmg.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Runners are ephemeral, but a cancelled or failed job can leave the
      # signing key in the login keychain search list for whatever runs next.
      - name: Remove the signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12"
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "${KEYCHAIN_PATH}" ]; then
            security list-keychain -d user -s login.keychain
            security delete-keychain "${KEYCHAIN_PATH}"
            echo "Deleted ${KEYCHAIN_PATH}"
          fi
